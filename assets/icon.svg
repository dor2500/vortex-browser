<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="vortexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <radialGradient id="vortexGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="128" fill="#090a0f" />
  <circle cx="256" cy="256" r="220" fill="url(#vortexGlow)" />

  <!-- Outer Ring Orbit -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="4" stroke-dasharray="8 12" />

  <!-- Vortex Spiral Blades -->
  <g filter="url(#neonBlur)">
    <!-- Blade 1 -->
    <path d="M256,76 C355,76 436,157 436,256 C436,305 416,350 384,384 C352,416 307,436 256,436 C190,436 132,400 102,348 C140,360 185,356 222,334 C270,305 292,248 274,196 C262,160 232,132 195,120 C214,92 234,76 256,76 Z" fill="url(#vortexGrad)" />
    
    <!-- Blade 2 - Core Whirl -->
    <path d="M190,140 C230,120 280,125 315,150 C360,182 375,242 348,290 C328,326 288,348 246,344 C210,340 178,318 162,284 C140,238 152,180 190,140 Z" fill="#ffffff" opacity="0.15" />
    
    <!-- Center Core Eye -->
    <circle cx="256" cy="256" r="28" fill="#ffffff" />
    <circle cx="256" cy="256" r="42" fill="none" stroke="#6366f1" stroke-width="4" opacity="0.8" />
  </g>
</svg>

